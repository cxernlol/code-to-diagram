        <h1>CTD Studio: Local-First Code to Diagram Editor</h1>
        <p>Write diagram code, drag boxes and connector lines into place, and export SVG or PNG directly in your browser. No account, no paywall, and local-first IndexedDB storage.</p>
        <h2>Supported Formats (7)</h2>
        <ul>
          <li><strong>Mermaid (v12.3.0):</strong> Full local runtime (flowchart, class, state, ER, sequence, gantt, mindmap, pie, journey, gitGraph, C4, requirement).</li>
          <li><strong>Graphviz DOT:</strong> <code>digraph</code>/<code>graph</code>, <code>rankdir</code>, node labels &amp; shapes, and <code>-&gt;</code> / <code>--</code> edges.</li>
          <li><strong>PlantUML:</strong> <code>@startuml</code> sequence, state, and class diagrams.</li>
          <li><strong>D2:</strong> <code>direction</code>, nested <code>{ ... }</code> containers, <code>.shape</code>, and labeled edges.</li>
          <li><strong>SQL DDL:</strong> <code>CREATE TABLE</code>, <code>PRIMARY KEY</code>, and <code>FOREIGN KEY</code> / <code>REFERENCES</code> into ER diagrams.</li>
          <li><strong>TypeScript:</strong> <code>interface</code>, <code>class</code>, and object <code>type</code> declarations into class diagrams.</li>
          <li><strong>XML:</strong> Explicit <code>&lt;diagram&gt;</code>, Draw.io <code>mxGraphModel</code>, BPMN <code>sequenceFlow</code>, and generic XML trees.</li>
        </ul>
        <h2>Quick Arrow &amp; Shape Reference</h2>
        <ul>
          <li><code>A --&gt; B</code> (solid arrow), <code>A -.-&gt; B</code> (dotted arrow), <code>A ==&gt; B</code> (thick arrow), <code>A --- B</code> (line)</li>
          <li><code>[Process]</code>, <code>([Start/End])</code>, <code>{Decision}</code>, <code>[/I/O/]</code>, <code>[(Database)]</code>, <code>((Circle))</code></li>
        </ul>
        <h2>Studio Editor Workflow &amp; Controls</h2>
        <ul>
          <li><strong>Split-Pane Workbench:</strong> Live CodeMirror source editor on the left (resizable 22%–50%) with instant debounced preview on the right, multi-tab workspace, and version history.</li>
          <li><strong>Canvas Tools (<code>V</code> / <code>H</code>):</strong> Move Tool (<code>V</code>) drags boxes across Flowchart, Class, State, ER, Requirement, and C4 diagrams with optional snap-to-grid; Hand Tool (<code>H</code>) or Space+drag pans; wheel or <code>+</code>/<code>-</code> zooms; <code>Shift+1</code> fits.</li>
          <li><strong>3-Point Connector Handles:</strong> Drag a line's start handle, midpoint waypoint, or end/arrow handle along node perimeters, or double-click / right-click to reset.</li>
          <li><strong>Right-Click Canvas Editing:</strong> Edit node/edge labels, switch flowchart shapes, add or suppress class/ER members, hide nodes (<code>%% sgs-hide</code>), or delete elements.</li>
          <li><strong>Looks, Themes &amp; Export:</strong> Switch Light/Dark mode, <code>classic</code> or <code>handDrawn</code> sketch look, theme presets, and export SVG or PNG (with optional colorized boxes and transparent background).</li>
          <li><strong>BYOK AI &amp; Live Rooms:</strong> Optional client-side AI bar (OpenAI, Anthropic, Gemini, OpenRouter, Ollama, custom) with Structure, Fix syntax, Style it, Tidy, and Explain popups, plus 5-device WebRTC live rooms.</li>
        </ul>
