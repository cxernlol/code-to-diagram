name: Publish MCP to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build and test MCP
        run: |
          npm run typecheck
          npm run mcp:build
          npm run mcp:test

      - name: Mirror @cxernlol/ctd-mcp to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/gh-pkg
          cp -r mcp /tmp/gh-pkg
          cd /tmp/gh-pkg
          npm pkg set name="@cxernlol/ctd-mcp"
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@cxernlol/ctd-mcp@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@cxernlol/ctd-mcp@${VERSION} already published on GitHub Packages; skipping."
          else
            printf "@cxernlol:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n" "$NODE_AUTH_TOKEN" > .npmrc
            npm publish --registry=https://npm.pkg.github.com
          fi

      - name: Publish ctd-mcp to npm (OIDC Trusted Publishing)
        working-directory: mcp
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "ctd-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "ctd-mcp@${VERSION} already published on npm; skipping."
          else
            OUT=$(npm publish --provenance --access public 2>&1) || {
              echo "$OUT"
              if echo "$OUT" | grep -q "E409"; then
                echo "ctd-mcp@${VERSION} is already staged on npm; skipping."
                exit 0
              fi
              exit 1
            }
            echo "$OUT"
          fi
