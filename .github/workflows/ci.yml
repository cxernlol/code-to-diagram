name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build web + MCP
        run: npm run build

      - name: Run parser unit tests
        run: npm run test:parsers

      - name: Run sidecar unit tests
        run: npm run test:sidecar

      - name: Run MCP server tests
        run: npm run mcp:test

      - name: Verify npx bin entrypoint
        run: npx --no-install ctd-mcp --version

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Render golden render-only fixture
        run: npm run test:render

      - name: Run Playwright E2E tests
        run: npx playwright test --workers=1

      - name: Security audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
